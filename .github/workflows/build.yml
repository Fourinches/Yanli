name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            targets: x86_64-pc-windows-msvc
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install frontend
        run: npm ci
      - name: Build
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-out/Yanli_1.2.3_windows_x64-setup.exe
      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        run: |
          set -eux
          find src-tauri/target -name '*.app' -o -name '*.dmg'
          APP=$(find src-tauri/target -name '*.app' -type d | head -n 1)
          DMG=$(find src-tauri/target -name '*.dmg' -type f | head -n 1)
          test -n "$APP"
          test -n "$DMG"
          chmod +x "$APP/Contents/MacOS/"* || true
          codesign --force --deep --sign - "$APP" || true
          lipo -info "$APP/Contents/MacOS/"* || file "$APP/Contents/MacOS/"*
          mkdir -p dist-out
          cp "$DMG" dist-out/Yanli_1.2.3_macos_universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: yanli-${{ matrix.os }}
          path: dist-out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-bundles
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bundles/**
          generate_release_notes: true
